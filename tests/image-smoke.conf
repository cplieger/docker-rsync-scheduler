# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Boots the image in external-trigger mode, then
# smoke_verify pushes a real file over rsync+ssh to a throwaway sshd sidecar on
# a dedicated docker network and asserts it ARRIVED, ending with a negative
# control that proves a payload that cannot start is reported as a failed pass.
#
# Constraints that shape the knobs below:
# - An rsync push needs rsync on BOTH ends, and the image under test is the only
#   image on the runner that already has it, so the sidecar is that same image
#   plus the one apk package it lacks (openssh-server).
# - The remote is reached by container name, which needs a user-defined network:
#   docker's embedded DNS does not serve the default bridge.
# - Host-key verification is NOT relaxed. With no /config/known_hosts mounted
#   the app's shipped default is StrictHostKeyChecking=accept-new, so the first
#   contact is recorded and the pass proceeds under the real posture.
# - The keypair is generated per run, so no key material enters git.
# - The negative control leaves the image broken, so it runs last.
SMOKE_APP_NAME=docker-rsync-scheduler
# External mode writes the marker healthy on boot, so the first probe inside the
# baked 120s start-period passes; 240 leaves margin for a slow cold boot.
SMOKE_TIMEOUT=240

# $$ is the harness's pid, the same suffix its own container name carries, so
# parallel runs never collide.
SMOKE_NET="smoke-rsync-net-$$"
SMOKE_SSHD="smoke-rsync-sshd-$$"
# One temp root, two mounts: /config (config + private key) and the job's source.
SMOKE_FIXTURE=$(mktemp -d)
# Unique per run, so a receiver answering with a stale file cannot pass.
SMOKE_PAYLOAD="rsync smoke payload $$"

# Releases everything the block below acquires. The harness's EXIT trap calls it
# after removing the app container, so the network has no endpoints left.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  docker rm -f "$SMOKE_SSHD" >/dev/null 2>&1 || true
  docker network rm "$SMOKE_NET" >/dev/null 2>&1 || true
  rm -rf "$SMOKE_FIXTURE"
}

# The harness arms that trap only AFTER sourcing this file, so a setup failure
# here has to release what it already took.
smoke_setup_failed() {
  printf 'FAIL: %s\n' "$1" >&2
  smoke_cleanup
  exit 1
}

if ! mkdir -p "$SMOKE_FIXTURE/config" "$SMOKE_FIXTURE/src"; then
  smoke_setup_failed "could not create the fixture directories"
fi
if ! printf '%s\n' "$SMOKE_PAYLOAD" >"$SMOKE_FIXTURE/src/hello.txt"; then
  smoke_setup_failed "could not write the source file"
fi
# The container runs as root and the key is owned by the runner, so ssh skips
# its permission check (it only applies to a key the calling uid owns) and root
# reads it whatever its mode.
if ! ssh-keygen -q -t ed25519 -N '' -C "$SMOKE_SSHD" -f "$SMOKE_FIXTURE/config/smoke_id"; then
  smoke_setup_failed "ssh-keygen could not create the throwaway keypair"
fi
if ! printf '%s\n' \
  'jobs:' \
  '  - name: smoke' \
  '    local: /sources/smoke' \
  "    remote_host: root@${SMOKE_SSHD}" \
  '    remote_path: /srv/smoke' \
  '    ssh_key: /config/smoke_id' \
  >"$SMOKE_FIXTURE/config/config.yaml"; then
  smoke_setup_failed "could not write the job config"
fi
# Created here rather than in smoke_verify: the app container joins it on the
# run line, which the harness issues before the hook runs.
if ! docker network create "$SMOKE_NET" >/dev/null; then
  smoke_setup_failed "could not create the smoke network"
fi

# Word-split by the harness; a mktemp path contains no spaces.
SMOKE_RUN_ARGS="--network ${SMOKE_NET} -e SYNC_INTERVAL=off -v ${SMOKE_FIXTURE}/config:/config:ro -v ${SMOKE_FIXTURE}/src:/sources/smoke:ro"

# Poll a container log for a fixed string: the json-file driver can lag the
# writer, so a single grep can miss a line already written.
smoke_wait_for_log() {
  i=0
  while [ "$i" -lt 30 ]; do
    if docker logs "$1" 2>&1 | grep -qF -- "$2"; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$3" >&2
  return 1
}

smoke_verify() {
  # The image under test doubles as the receiver: it already carries the
  # source-built rsync an ssh push needs on the remote end, so the sidecar costs
  # one apk package instead of a second image and a second pin.
  img=$(docker inspect --format '{{ .Config.Image }}' "$SMOKE_CONTAINER")
  docker run -d --name "$SMOKE_SSHD" --network "$SMOKE_NET" \
    -v "$SMOKE_FIXTURE/config/smoke_id.pub:/authorized_keys:ro" \
    --entrypoint sh "$img" -c 'set -e
      apk add --no-cache openssh-server >/dev/null
      ssh-keygen -A >/dev/null
      mkdir -p /root/.ssh /srv/smoke
      cp /authorized_keys /root/.ssh/authorized_keys
      chmod 700 /root/.ssh
      chmod 600 /root/.ssh/authorized_keys
      exec /usr/sbin/sshd -D -e' >/dev/null
  smoke_wait_for_log "$SMOKE_SSHD" 'Server listening' \
    "the sshd sidecar never listened, so the push had no remote to reach (it needs outbound apk access)"

  # A real pass through the app's own trigger path: socket client -> queue ->
  # executor -> rsync -e ssh.
  if ! out=$(docker exec "$SMOKE_CONTAINER" docker-rsync-scheduler sync 2>&1); then
    printf 'FAIL: the triggered pass against the sshd sidecar did not exit 0\n' >&2
    printf '%s\n' "$out" >&2
    return 1
  fi
  # The receiver's own copy is the only proof the compiled rsync and its ssh
  # transport moved the bytes.
  if ! got=$(docker exec "$SMOKE_SSHD" cat /srv/smoke/hello.txt 2>&1); then
    printf 'FAIL: the pushed file is absent from the remote\n' >&2
    printf '%s\n' "$got" >&2
    return 1
  fi
  if [ "$got" != "$SMOKE_PAYLOAD" ]; then
    printf 'FAIL: the remote file content differs from what was pushed\n' >&2
    printf 'want: %s\n' "$SMOKE_PAYLOAD" >&2
    printf 'got:  %s\n' "$got" >&2
    return 1
  fi
  # Exit 0 alone is not enough: an empty or unmounted source SKIPS the job and
  # the pass still reports ok, so this line is what separates a transfer from a
  # skip and proves the daemon parsed rsync's --stats on a real run.
  smoke_wait_for_log "$SMOKE_CONTAINER" 'msg="sync ok" job=smoke files=1' \
    "the pass exited 0 but transferred no file: the source was skipped, not synced"
  if ! docker exec "$SMOKE_CONTAINER" docker-rsync-scheduler health; then
    printf 'FAIL: health did not pass after a completed pass\n' >&2
    return 1
  fi

  # Negative control. Hiding a shared library the source-built rsync links makes
  # the binary fail to start, the shape of a final stage that stops installing
  # one of rsync's runtime libs (they are hand-listed, unpinned apk packages).
  if ! docker exec -u root "$SMOKE_CONTAINER" \
    mv /usr/lib/libzstd.so.1 /tmp/smoke-hidden-libzstd; then
    printf 'FAIL: could not hide /usr/lib/libzstd.so.1; the control premise moved and the path needs re-pointing\n' >&2
    return 1
  fi
  if docker exec "$SMOKE_CONTAINER" docker-rsync-scheduler sync >/dev/null 2>&1; then
    printf 'FAIL: a pass whose rsync could not start was reported as successful\n' >&2
    return 1
  fi
  smoke_wait_for_log "$SMOKE_CONTAINER" 'msg="sync failed" job=smoke' \
    "the pass exited non-zero but the daemon never logged the job failure"
  if docker exec "$SMOKE_CONTAINER" docker-rsync-scheduler health >/dev/null 2>&1; then
    printf 'FAIL: health still passes after a failed pass\n' >&2
    return 1
  fi

  # Every assertion above is silent on success, so without this line a run that
  # did the whole push is indistinguishable from one whose hook returned early:
  # the harness prints only its own health verdict either way. Name what was
  # proved, so the elapsed time in that verdict has something to account for.
  printf 'docker-rsync-scheduler payload: pushed %s over rsync+ssh to %s and read it back; a pass whose rsync could not start was reported failed\n' \
    "$SMOKE_PAYLOAD" "$SMOKE_SSHD"
}
